<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueryPilot</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app">
        <header>
            <h1>QueryPilot</h1>
            <p>Ask your data a question in plain English.</p>
        </header>

        <div class="upload-row">
            <label class="upload-btn">
                Upload CSV / Excel
                <input type="file" id="file" accept=".csv,.xlsx,.xls" hidden>
            </label>
            <span id="upload-status"></span>
        </div>

        <div class="ask-row">
            <input type="text" id="question" placeholder="e.g. total revenue per category">
            <button id="ask-btn">Ask</button>
        </div>

        <div class="examples">
            <span>Try:</span>
            <button class="chip">How many customers are in the South region?</button>
            <button class="chip">What is the total revenue per product category?</button>
            <button class="chip">Which product has the highest price?</button>
        </div>

        <div id="loading" class="hidden">thinking…</div>

        <div id="result" class="hidden">
            <div id="answer" class="answer"></div>

            <div id="kpi" class="kpi hidden"></div>
            <div id="chart-box" class="card hidden">
                <canvas id="chart"></canvas>
            </div>

            <div id="table-box" class="card"></div>

            <details class="card">
                <summary>Show SQL</summary>
                <pre id="sql"></pre>
            </details>

            <details class="card">
                <summary>How it worked</summary>
                <ul id="trace"></ul>
            </details>
        </div>

        <div id="error" class="error hidden"></div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
