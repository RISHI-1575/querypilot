<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueryPilot</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="chat">
        <header class="chat-head">
            <div class="brand">
                <span class="dot"></span>
                QueryPilot
            </div>
            <button type="button" class="upload-btn" id="demo">Load demo data</button>
            <label class="upload-btn">
                Upload data
                <input type="file" id="file" accept=".csv,.xlsx,.xls,.db,.sqlite,.sqlite3,.sql" hidden>
            </label>
        </header>

        <div id="messages" class="messages">
            <!-- welcome message -->
            <div class="msg bot">
                <div class="bubble">
                    <p>Hey 👋 I'm QueryPilot. Upload a CSV, Excel, or SQLite file (or load
                    the demo data) and I'll figure out the query, run it, and show you
                    the answer.</p>
                </div>
            </div>
        </div>

        <form class="composer" id="composer">
            <input type="text" id="question" placeholder="Ask a question…" autocomplete="off">
            <button type="submit" id="send" aria-label="Send">↑</button>
        </form>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
