<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueryPilot</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="chat">
        <header class="chat-head">
            <div class="brand">
                <span class="dot"></span>
                QueryPilot
            </div>
            <label class="upload-btn">
                Upload data
                <input type="file" id="file" accept=".csv,.xlsx,.xls" hidden>
            </label>
        </header>

        <div id="messages" class="messages">
            <!-- welcome message -->
            <div class="msg bot">
                <div class="bubble">
                    <p>Hey 👋 I'm QueryPilot. Ask me anything about your data and I'll
                    figure out the query, run it, and show you the answer.</p>
                    <div class="chips">
                        <button class="chip">How many customers are in the South region?</button>
                        <button class="chip">What is the total revenue per product category?</button>
                        <button class="chip">Which product has the highest price?</button>
                    </div>
                </div>
            </div>
        </div>

        <form class="composer" id="composer">
            <input type="text" id="question" placeholder="Ask a question…" autocomplete="off">
            <button type="submit" id="send" aria-label="Send">↑</button>
        </form>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
